[package]
name = "atlas_prime"
version = "0.3.0"
edition = "2024"

# v1 headless（system/task/web/db 四黑箱）最小依赖集；
# 电池走 termux-api CLI，不再需要 termuxapi crate。
[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
directories = "6.0.0"
libc = "0.2"
tokio = { version = "1.49.0", features = ["full"] }
sqlx = { version = "0.8.6", features = [ "runtime-tokio",  "sqlite" ] }
ntex = "4.3"
ntex-cors = "4.1"
local-ip-address = "0.6.9"    # v1/system/ip 的 getifaddrs 封装

# —— _deprecated_src/ 遗留依赖，重写涉及对应功能时再按需恢复 ——
# crossterm = { version = "0.29.0", features = ["event-stream"] }
# ratatui = { version = "0.30.0", features = ["all-widgets"] }
# ansi-to-tui = "8.0.1"
# sysinfo = "0.38.0"            # v1/system 以 /proc + sysfs 替代
# termuxapi = "0.1.1"           # v1/system/battery 直读 CLI JSON
# backtrace = "0.3.76"
# chrono = "0.4.43"
# futures = "0.3.31"
# notify = "8.2.0"
# smart-default = "0.7.1"
# image = "0.25.9"
# csv = "1.3.0"
# reqwest = { version = "0.13.1", features = ["json", "http2","native-tls","webpki-roots"], default-features = false }  # for termux build
# surrealdb = { version = "2.4.1", features = ["kv-rocksdb"] }
# mongodb = { version = "3.5.0", features = ["snappy-compression"] }

# system require :
# pkg i deno pkg-config chafa surreal

[profile.release]
opt-level = "z"      # 专门针对体积进行优化 (z 表示压缩体积，s 也可以)
lto = true           # 开启链接时优化 (Link Time Optimization)
codegen-units = 1    # 减少并行编译单元，增加优化空间
panic = "abort"      # 移除栈回溯展开代码 (极其显著减小体积)
strip = true         # 自动从二进制文件中剔除符号信息 (Symbol Table)
